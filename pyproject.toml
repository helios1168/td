[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "td"
version = "0.3.0"
description = "Support-master territory design: master MILP, ZIP realizer and audited ledger"
requires-python = ">=3.11"
dependencies = [
    "numpy", "scipy", "networkx", "highspy", "pandas",
    "geopandas", "shapely", "pyogrio", "pyproj", "matplotlib",
]

[tool.setuptools.packages.find]
include = ["td*"]
