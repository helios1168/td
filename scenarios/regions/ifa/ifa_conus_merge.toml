# The CONUS IFA merge (tools/exp/contig/merge.py): merge.py sets k to the merged district count,
# frees every state split between two merged districts, and sets final_delta from --window.
[scenario]
name = "ifa_conus_merge"
fine_channels = ["ifa"]
planned_elsewhere = ["career", "edj", "fi", "imo", "national_chase", "priafs", "wells_fi", "wells_wh", "wh"]
delta = 0.1

[channels.IFA]
margin = false
k = 1
domain = [{ units = "all", fine = ["ifa"] }]
mode = "whole"
eta = 0.05
max_size = 1
max_dist_km = 900
dist_km = { }
delta = 0.15
final_delta = 0.15
