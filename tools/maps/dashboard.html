<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Territory coverage</title>
<style>
<!--CSS-->
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <h1>Territory coverage</h1>
    <p id="runline"></p>
    <p class="made" id="made" hidden></p>
  </div>
  <div class="rows">
    <div class="row">
      <div class="ctl"><span class="lab" id="l-of">View of</span><div class="seg" id="c-of" role="group" aria-labelledby="l-of"></div></div>
      <label class="ctl"><span class="lab"><span id="l-sc">Scenario</span> <span class="id" id="sc-id"></span></span><select id="c-sc"></select></label>
      <div class="ctl"><span class="lab" id="l-est">Estimate of the market</span><div class="seg" id="c-est" role="group" aria-labelledby="l-est"></div></div>
      <div class="ctl"><span class="lab">Products</span><span class="fixed" id="c-products"></span></div>
    </div>
    <div class="row">
      <div class="ctl"><span class="lab" id="l-view">Colour each ZIP by</span><div class="seg" id="c-view" role="group" aria-labelledby="l-view"></div></div>
      <div class="ctl"><span class="lab" id="l-ch">Channel</span><div class="seg" id="c-ch" role="group" aria-labelledby="l-ch"></div></div>
      <label class="ctl"><span class="lab">Focus</span><select id="c-focus"></select></label>
      <label class="ctl find"><span class="lab">Find</span><input id="c-find" type="search" list="find-list" autocomplete="off" spellcheck="false">
        <datalist id="find-list"></datalist></label>
    </div>
  </div>
  <p class="found" id="found" role="status"></p>
</header>
<main>
  <section class="map-wrap" aria-label="Map">
    <div id="map"></div>
    <div class="over top" id="chips"></div>
    <p class="over caption" id="caption"></p>
    <aside class="over card" id="card" aria-label="Selection" hidden></aside>
    <div id="tip" hidden></div>
  </section>
  <section class="tables" aria-label="Wholesalers and tables">
    <div class="strip" id="strip"></div>
    <div class="tbl" id="t-main"></div>
  </section>
  <aside class="side">
    <section class="totals" id="totals" aria-label="Totals"></section>
    <section class="detail" id="detail" aria-label="The focused state"></section>
  </aside>
</main>
<dialog id="licence-box">
  <form method="dialog"><button class="plain">Close</button></form>
  <pre id="licence-text"></pre>
</dialog>
<script type="text/plain" id="licence"><!--LICENCE--></script>
<script type="application/json" id="data"><!--DATA--></script>
<script type="text/plain" id="geom"><!--GEOM--></script>
<!--VENDOR-->
<script type="module">
<!--LIBRARY-->
</script>
<script type="module">
<!--JS-->
</script>
</body>
</html>
